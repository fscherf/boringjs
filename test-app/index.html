<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>boring.js</title>

    <style>
      #absolute-path-css::before {
        content: "Loading CSS from absolute URLs does not work";
        color: red;
      }

      #relative-path-css::before {
        content: "Loading CSS from relative URLs does not work";
        color: red;
      }

      #inline-css::before {
        content: "Loading CSS from inline styles does not work";
        color: red;
      }
    </style>
  </head>
  <body>
    <div id="menu"></div>

    <main id="main">
      Loading...
    </main>

    <template name="error-404">
      <h1>Error 404</h1>
      <p>Not Found</p>
    </template>

    <script src="/static/dist/boring.js"></script>
    <script>
      const context = {
        name: "World",
        startupTime: (new Date()).toLocaleTimeString(),
      };

      boring.addRegion("menu", "#menu", context);
      boring.addRegion("main", "#main", context);

      // setup routes
      boring.addRoute("/", (params) => {
        boring.render("main", "index");
      }, "index");

      boring.addRoute("/loading", async (params) => {
        await boring.render("main", "loading/index");

        try {
          loadingLinkedAbsolutePathScriptFunction();
        } catch(error) {
          console.error(error);
        }

        try {
          loadingLinkedRelativePathScriptFunction();
        } catch(error) {
          console.error(error);
        }

        try {
          loadingInlineScriptFunction();
        } catch(error) {
          console.error(error);
        }
      }, "loading");

      boring.addRoute("*path", (params) => {
        boring.render("main", "error-404");
      }, "fallback");

      // log all boring events
      document.addEventListener("boring:event", event => {
        console.log(event.detail.event.type, event.detail.event.detail);
      }, true);

      // fallback for non matching routes
      // (this will not fire as long as the fallback route is in place)
      document.addEventListener("boring:routing-miss", async (event) => {
        await boring.render("main", "error-404");
      });

      // initial render
      boring.render("menu", "menu");

      boring.route();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
  </body>
</html>
